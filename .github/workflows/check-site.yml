name: Check website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node scripts/build-home.mjs --check
      - run: python scripts/check-site.py
      - name: Check JavaScript syntax
        run: find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
