<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings - Chengxiang Qi</title>
    <meta name="description" content="Technical articles, systems engineering notes, and personal essays by Chengxiang Qi.">
    <link rel="canonical" href="https://kuangjux.top/writings.html">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/writings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/data/writings.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="nav-brand">Chengxiang Qi</a>
                <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="main-nav">
                    <span class="nav-toggle-bar"></span>
                    <span class="nav-toggle-bar"></span>
                    <span class="nav-toggle-bar"></span>
                </button>
                <div class="nav-links" id="main-nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="writings.html" class="nav-link active">Writings</a>
                    <a href="https://notes.kuangjux.top/" class="nav-link">Notes ↗</a>
                    <a href="running.html" class="nav-link">Running</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="writings-hero">
        <div class="container">
            <h1 class="writings-hero-title">Writings</h1>
            <p class="writings-hero-subtitle">Technical articles and personal essays.</p>
            <p class="writings-notes-link">Reading notes &amp; ongoing study → <a href="https://notes.kuangjux.top/">Notes</a></p>
        </div>
    </section>

    <!-- Search and Filter Section -->
    <section class="writings-filter">
        <div class="container">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input
                        type="text"
                        id="search-input"
                        class="search-input"
                        aria-label="Search writings"
                        placeholder="Search writings by title, excerpt, or category..."
                        autocomplete="off"
                    >
                    <button id="clear-search" aria-label="Clear search" class="clear-search" style="display: none;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="search-results-info" class="search-results-info"></div>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="technical">Technical</button>
                <button class="filter-btn" data-filter="essays">Essays</button>
                <button class="filter-btn" data-filter="fiction">Fiction</button>
                <button class="filter-btn" data-filter="philosophy">Philosophy</button>
            </div>
        </div>
    </section>

    <!-- Writings Grid -->
    <section class="writings-content">
        <div class="container">
            <div class="writings-grid"></div>

            <!-- Pagination -->
            <div class="pagination" style="display: none;">
                <button class="pagination-btn" id="prev-page">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <div class="pagination-info">
                    <span id="page-info">Page <span id="current-page">1</span> of <span id="total-pages">1</span></span>
                </div>
                <button class="pagination-btn" id="next-page">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Chengxiang Qi. All rights reserved.</p>
            <p>Technical articles &amp; personal essays</p>
        </div>
    </footer>

    <script src="js/render/writings.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
